version: 1
profile: radar27_pipeline
notebooks:
  - id: setup_sources_download
    order: 0
    path: notebooks/00_setup_sources_download.ipynb
    depends_on: []
    inputs:
      - configs/sources.yaml
      - Manual-Conteos-Censales-2009-2024.pdf
    outputs:
      - data/manifests/source_manifest.csv
      - data/manifests/zip_member_inventory.csv
      - data/interim/extracted
    artifacts:
      - path: data/manifests/source_manifest.csv
        type: manifest
        cell_id: download-official-sources
        cell_tag: artifact-source-manifest
      - path: data/manifests/zip_member_inventory.csv
        type: inventory
        cell_id: summarize-zip-members
        cell_tag: artifact-zip-inventory
  - id: raw_schema_audit
    order: 1
    path: notebooks/01_raw_schema_audit.ipynb
