version: 1
objective: test_sociodemographic_peer_graph_features_and_neighbor_only_embedding
random_seed: 27
evaluation_targets: [2018, 2021, 2024]
primary_target_year: 2021
feature_group: competition_concurrency
feature_config: configs/feature_ablation.yaml
reference_model_config: configs/tabular_challengers.yaml
reference_model: hist_gradient_boosting_entity_cycle_reference
candidate_model_prefix: hist_gradient_boosting_plus_sociodemographic_peers
baseline_model: lag_same_type_stable_plus_official_lineage
residual_shrinkage: 0.25
entity_cycle_decision: artifacts/entity_cycle_adaptation_decision.json
expected_entity_cycle_shrinkage: -0.5
maximum_other_fold_weighted_mae_deterioration: 0.005
validation_entity_ids: ["04", "14", "20", "26", "31"]

# Las aristas nunca usan participacion ni el outcome. Todas estas variables son
# composiciones de la lista nominal observadas en la eleccion anterior.
similarity_features:
  - female_nominal_share_lag1
  - age_18_29_nominal_share_lag1
  - age_30_44_nominal_share_lag1
  - age_45_64_nominal_share_lag1
  - age_65_plus_nominal_share_lag1

topologies:
  mutual_k8: 8
  mutual_k16: 16
graph_policy:
  mutual_neighbors_only: true
  isolated_node_fallback: nearest_neighbor
  allow_cross_entity_edges: true
  standardization: prior_years_non_validation_entities_only

peer_source_features:
  - participation_same_type
  - participation_lag1
  - participation_change_lag1_lag2
  - participation_historical_mean
  - participation_trend_per_year
peer_statistics: [mean, std, node_minus_mean, zscore]
zscore_clip: 10.0

encoder:
  family: neighbor_only_denoising_autoencoder
  uses_own_node_features: false
  hidden_dim: 64
  embedding_dim: 16
  input_dropout: 0.15
  hidden_dropout: 0.10
  learning_rate: 0.003
  weight_decay: 0.0001
  maximum_epochs: 45
  patience: 7
  minimum_delta: 0.00001
  gradient_clip_norm: 5.0
  torch_threads: 4

candidate_feature_sets: [explicit, embedding, combined]

outputs:
  graph_directory: artifacts/sociodemographic_similarity
  model_directory: artifacts/models/sociodemographic_similarity
  predictions: artifacts/tables/sociodemographic_similarity_predictions.parquet
  metrics: artifacts/tables/sociodemographic_similarity_metrics.csv
  registry: artifacts/tables/sociodemographic_similarity_registry.csv
  graph_registry: artifacts/tables/sociodemographic_similarity_graph_registry.csv
  decision: artifacts/sociodemographic_similarity_decision.json
