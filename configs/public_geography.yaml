lineage_policy:
  eligible_case_labels:
    - DIVISIÓN DE SECCIONES
    - FUSIÓN DE SECCIONES
  ambiguous_cases:
    - reassignment
    - boundary_change
    - georeferencing_change
  event_availability_rule: >-
    For a target election in year t, only AMGE events with effective_year strictly less than t
    are used. This conservative rule prevents same-year post-election information leakage when
    the workbook supplies only a year rather than an exact effective date.
  no_fractional_allocation: true
  component_rule: undirected_connected_components_of_eligible_origin_destination_edges
