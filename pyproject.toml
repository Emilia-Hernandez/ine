[project]
name = "radar27"
version = "0.1.0"
description = "Auditoría reproducible de los Conteos Censales de Participación Ciudadana del INE"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.2,<2",
  "ipykernel>=6.29,<7",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "psutil>=6,<8",
  "pyarrow>=17,<22",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.7,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
